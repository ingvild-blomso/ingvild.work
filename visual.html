<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Visual — Ingvild Blomsø</title>

  <style>
    :root {
      --background: #f6f1e8;
      --text: #111111;
      --muted: #6a645d;
      --line: #d8d0c3;
      --max-width: 1200px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      width: min(var(--max-width), calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      padding: 28px 0;
      border-bottom: 1px solid var(--line);
      margin-bottom: 48px;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-weight: 700;
    }

    h1 {
      font-size: clamp(2.8rem, 7vw, 5rem);
      line-height: 0.92;
      letter-spacing: -0.06em;
      margin: 0 0 24px;
    }

    .intro {
      max-width: 720px;
      margin-bottom: 72px;
      color: var(--muted);
      font-size: 1.1rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      margin-bottom: 80px;
    }

    .gallery video {
        width: 100%;
        display: block;
        border-radius: 2px;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 24px 0 40px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    @media (max-width: 800px) {
      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="wrap">
    <nav>
      <div class="brand">
        <a href="index.html">ingvild.work</a>
      </div>

      <a href="index.html">Tilbake</a>
    </nav>
  </header>

  <main class="wrap">

    <h1>Visual</h1>

<section class="gallery">

  <video autoplay muted loop playsinline>
    <source src="videos/video-01.mov" type="video/quicktime">
  </video>

  <video autoplay muted loop playsinline>
    <source src="videos/video-02.mov" type="video/quicktime">
  </video>

  <video autoplay muted loop playsinline>
    <source src="videos/video-03.mov" type="video/quicktime">
  </video>

</section>

  </main>

  <footer class="wrap">
    © 2026 Ingvild Blomsø
  </footer>

</body>
</html>
